name: Plugin bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Plugin bauen
        run: mvn -B clean package

      - name: Fertige JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DungeonQuest
          path: target/DungeonQuest.jar
